name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# How much history a checkout takes. It has to reach every commit
# `docs/progress.json` names; `scripts/ensure-history.sh` proves that it does
# and deepens a bounded number of times if it does not, so this is a starting
# depth rather than an assumption.
env:
  HISTORY_DEPTH: 250

jobs:
  verify:
    name: Verify
    # Pinned rather than tracked. `ubuntu-latest` moves to the next image on
    # GitHub's schedule, and the browser gate below depends on the Chrome this
    # image ships; a silent image bump is a silently different gate.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The published timeline resolves commit references against the checked
      # out history, so the clone has to reach every commit `docs/progress.json`
      # names — and no further. `fetch-depth: 0` reached all of them by reaching
      # everything, including every branch this repository has and the 34 MB
      # WebAssembly modules on the generated `pages-live` branch. A finite depth
      # fetches only this branch, and the step below proves that depth really
      # covers the referenced commits instead of assuming it.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.HISTORY_DEPTH }}
          filter: blob:none

      # The runner's temporary directory is a runner fact, and a job-level
      # `env:` is evaluated before a runner exists. It is resolved here, from
      # the environment the runner really hands the step, so every later step
      # names one workflow-owned result root instead of rebuilding the path.
      #
      # It is resolved first, before any step that can fail. A job that died
      # before this ran would leave the summary below with no result root to
      # read and no gate file to summarize, and would publish a run that could
      # not say what went wrong with it.
      - name: Resolve the native result root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native"
          echo "RESULT=$RUNNER_TEMP/native" >> "$GITHUB_ENV"
          echo "GATES=$RUNNER_TEMP/native/gates.jsonl" >> "$GITHUB_ENV"

      # The history bound and the script that applies it are measured gates
      # like every other, not preconditions. A short clone is a fact this run
      # publishes: the later gates still run, the summary still counts them,
      # and the artifact still travels, instead of the job ending here with
      # nothing to show for it. These reach no network beyond the repository's
      # own remote and start no browser.
      - name: Run the history gates
        run: |
          set -uo pipefail

          ./scripts/run-gate.sh "$GATES" "Published history bound" -- \
            ./scripts/ensure-history.sh

          ./scripts/run-gate.sh "$GATES" "History bound tests" -- \
            python3 scripts/ensure_history_test.py


      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1 \
            libegl1 \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            xvfb

      # Dependency sources only. Compiled output is deliberately not cached:
      # a restored `target/` would let a stale artifact decide a gate, and the
      # gates here are the only thing the published site is allowed to claim.
      - name: Cache the Cargo dependency sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-verify-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-deps-verify-${{ runner.os }}-

      # The rendered contract is the site's image evidence, so the adapter it
      # renders on is pinned to Mesa's software rasterizer instead of whatever
      # the image happens to expose. The adapter is proved present first: a
      # name that selects nothing would silently fall back to another device
      # and publish frames from a renderer nobody chose.
      - name: Pin the software renderer
        run: |
          set -euo pipefail
          summary="$(xvfb-run -a vulkaninfo --summary 2>&1 || true)"
          printf '%s\n' "$summary"
          if ! printf '%s' "$summary" | grep -qi 'llvmpipe'; then
            echo "no llvmpipe Vulkan device is present on this runner" >&2
            echo "the rendered contract may only publish software-rendered frames" >&2
            exit 1
          fi
          {
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "WGPU_BACKEND=vulkan"
            echo "WGPU_ADAPTER_NAME=llvmpipe"
          } >> "$GITHUB_ENV"

      # Every named gate runs and is recorded even after an earlier one fails,
      # so one run publishes the whole matrix instead of stopping at the first
      # red row. scripts/run-gate.sh never fails the step; the verdict below is
      # the single place this job concludes.
      - name: Run the native gates
        env:
          BEVY_ASSET_ROOT: ${{ github.workspace }}
        run: |
          set -uo pipefail

          ./scripts/run-gate.sh "$GATES" "Workflow lint" -- \
            ./scripts/actionlint.sh

          ./scripts/run-gate.sh "$GATES" "Published progress data" -- \
            cargo run --quiet --bin sitegen -- validate \
              --progress docs/progress.json \
              --plan docs/implementation-plan.md \
              --repository .

          ./scripts/run-gate.sh "$GATES" "Rust formatting" -- \
            cargo fmt --all --check

          ./scripts/run-gate.sh "$GATES" "Clippy lints" -- \
            cargo clippy --all-targets --all-features -- -D warnings

          ./scripts/run-gate.sh "$GATES" "Generated asset freshness" -- \
            cargo run --quiet --bin assetgen -- --check

          ./scripts/run-gate.sh "$GATES" "Library and binary tests" -- \
            cargo test --lib --bins

          ./scripts/run-gate.sh "$GATES" "Asset contracts" -- \
            cargo test --test asset_contract

          ./scripts/run-gate.sh "$GATES" "Application contracts" -- \
            cargo test --test app_contract

          ./scripts/run-gate.sh "$GATES" "Site generation contracts" -- \
            cargo test --test sitegen_contract

          ./scripts/run-gate.sh "$GATES" "Pages assembly contracts" -- \
            cargo test --test pages_assembly_contract

          ./scripts/run-gate.sh "$GATES" "Rendered image contracts" -- \
            xvfb-run -a cargo test --test render_contract -- --test-threads=1

          ./scripts/run-gate.sh "$GATES" "Release build" -- \
            cargo build --release

          # Every named gate above has to leave exactly one row behind, and the
          # history gates measured before them count too. A gate name the
          # recording runner refuses is recorded nowhere and its command never
          # runs, so a run that is short a row would otherwise publish a green
          # matrix with one gate silently missing from it. The shortfall becomes
          # a public failed row instead, and the verdict step below concludes on
          # it like any other red gate.
          expected=14
          recorded=0
          if [[ -f "$GATES" ]]; then
            recorded="$(grep -c '' "$GATES")"
          fi
          if (( recorded != expected )); then
            echo "recorded $recorded of $expected named gates" >&2
            printf '{"name":"Named gate list","status":"failed","duration_ms":0}\n' \
              >>"$GATES"
          fi

      # The rendered contract keeps its whole run under target/render-contract.
      # Only the report and the frames are lifted into the workflow-owned
      # evidence root; the captured stdout and stderr stay behind as run
      # diagnostics and never reach a published page.
      - name: Collect the verification evidence
        if: always()
        run: |
          set -uo pipefail
          source="target/render-contract/primary"
          destination="$RESULT/verification"
          mkdir -p "$destination"
          if [[ -f "$source/report.json" ]]; then
            cp "$source/report.json" "$destination/"
            find "$source" -maxdepth 1 -type f -name '*.png' \
              -exec cp {} "$destination/" \;
          fi
          ls -1 "$destination" || true

      # A green render gate has exactly one interesting run in it: the primary
      # journey whose frames the site publishes. The fault-injection runs beside
      # it only prove the analyzers bite, and shipping them turns every routine
      # green run into a large artifact nobody opens. When the gate went red the
      # whole directory travels, because then any of those runs may be the
      # reason it did.
      - name: Select the rendered run diagnostics
        if: always()
        run: |
          set -uo pipefail
          selected="$RUNNER_TEMP/render-diagnostics"
          rm -rf "$selected"
          mkdir -p "$selected"
          gate=""
          if [[ -f "$GATES" ]]; then
            gate="$(grep -F '"name":"Rendered image contracts"' "$GATES" | tail -n 1)"
          fi
          if [[ "$gate" == *'"status":"passed"'* ]]; then
            if [[ -d target/render-contract/primary ]]; then
              cp -R target/render-contract/primary "$selected/primary"
            fi
          elif [[ -d target/render-contract ]]; then
            cp -R target/render-contract/. "$selected/"
          fi
          ls -1 "$selected" || true

      - name: Upload the rendered run diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: render-contract-diagnostics
          path: ${{ runner.temp }}/render-diagnostics
          retention-days: 7
          if-no-files-found: ignore

      # This step never fails: a job that cannot summarize itself still has to
      # upload whatever it measured, and Publish reads a missing manifest as a
      # failed job rather than as a silent success.
      - name: Summarize the native gates
        id: native
        if: always()
        run: |
          set -uo pipefail
          status="$(cargo run --quiet --bin sitegen -- result \
            --job verify \
            --gates "$GATES" \
            --output "$RESULT" || echo failed)"
          echo "status=${status:-failed}" >> "$GITHUB_OUTPUT"

      - name: Upload the native result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: native-result
          path: ${{ runner.temp }}/native
          retention-days: 7
          if-no-files-found: warn

      - name: Conclude the native verdict
        if: always()
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: |
          set -uo pipefail
          if [[ "$STATUS" != "passed" ]]; then
            echo "the native gates concluded ${STATUS:-failed}" >&2
            echo "every measured gate is in the native-result artifact" >&2
            exit 1
          fi

  build-web:
    name: Build web
    # Verify is a dependency for ordering, not a precondition. A red native
    # gate must not delete the web job: Publish reads both measured results to
    # decide what it publishes, and a job that never ran leaves no gates, no
    # package, and no browser evidence for it to read. The job still reaches
    # its own truthful verdict below, so a failed web gate still fails here.
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # This job runs the site generator too — `scripts/web-smoke.sh` builds the
      # real homepage the browser gate proves — and the generator resolves the
      # commit every finished task names. So this checkout gets the same
      # bounded depth, the same blob filter, and the same proof that the depth
      # really reaches those commits as the jobs that validate them.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.HISTORY_DEPTH }}
          filter: blob:none

      - name: Resolve the web result root
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web"
          echo "RESULT=$RUNNER_TEMP/web" >> "$GITHUB_ENV"
          echo "GATES=$RUNNER_TEMP/web/gates.jsonl" >> "$GITHUB_ENV"

      # As in Verify, the history bound is a measured gate rather than a
      # precondition, so a short clone is published as a failed row and the web
      # gates below still run and are still counted.
      - name: Run the history gate
        run: |
          set -uo pipefail

          ./scripts/run-gate.sh "$GATES" "Published history bound" -- \
            ./scripts/ensure-history.sh

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev

      - name: Resolve the preinstalled Chrome
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || true)"
          if [[ -z "$chrome" || ! -x "$chrome" ]]; then
            echo "no preinstalled Google Chrome was found on this runner" >&2
            exit 1
          fi
          "$chrome" --version
          echo "CHROME=$chrome" >> "$GITHUB_ENV"

      # Dependency sources only, for the same reason Verify caches nothing it
      # compiles: the packaged WebAssembly the site serves is built here.
      - name: Cache the Cargo dependency sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-web-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-deps-web-${{ runner.os }}-

      - name: Run the web gates
        run: |
          set -uo pipefail

          ./scripts/run-gate.sh "$GATES" "WebAssembly toolchain" -- \
            ./scripts/install-wasm-toolchain.sh

          ./scripts/run-gate.sh "$GATES" "WebAssembly package" -- \
            ./scripts/build-web.sh "$RESULT/play"

          ./scripts/run-gate.sh "$GATES" "Headless browser gate" -- \
            ./scripts/web-smoke.sh "$RESULT/play" "$RESULT/browser"

          # As in Verify: a refused gate name records nothing, so a short row
          # count is published as a failed row rather than as a green matrix
          # with a gate missing from it. The history gate measured before these
          # counts too.
          expected=4
          recorded=0
          if [[ -f "$GATES" ]]; then
            recorded="$(grep -c '' "$GATES")"
          fi
          if (( recorded != expected )); then
            echo "recorded $recorded of $expected named gates" >&2
            printf '{"name":"Named gate list","status":"failed","duration_ms":0}\n' \
              >>"$GATES"
          fi

      - name: Summarize the web gates
        id: web
        if: always()
        run: |
          set -uo pipefail
          status="$(cargo run --quiet --bin sitegen -- result \
            --job build-web \
            --gates "$GATES" \
            --output "$RESULT" || echo failed)"
          echo "status=${status:-failed}" >> "$GITHUB_OUTPUT"

      # The packaged game, the browser gate summary, its canvas and page
      # screenshots, and every measured gate travel together, so a failed run
      # still hands Publish everything Publish is allowed to publish.
      - name: Upload the web result
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: web-result
          path: ${{ runner.temp }}/web
          retention-days: 7
          if-no-files-found: warn

      - name: Conclude the web verdict
        if: always()
        env:
          STATUS: ${{ steps.web.outputs.status }}
        run: |
          set -uo pipefail
          if [[ "$STATUS" != "passed" ]]; then
            echo "the web gates concluded ${STATUS:-failed}" >&2
            echo "every measured gate is in the web-result artifact" >&2
            exit 1
          fi

  publish:
    name: Publish
    if: always()
    needs: [verify, build-web]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    steps:
      # As in Verify: a finite depth that is proved to reach every published
      # commit, rather than an unbounded clone of every branch.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ env.HISTORY_DEPTH }}
          filter: blob:none

      # Publish has to publish. A short clone is already a failed row measured
      # in Verify, so this repairs the history when it can and never ends the
      # job when it cannot: the generator below decides what it can publish
      # from what it actually has.
      - name: Reach every referenced commit if the history allows it
        continue-on-error: true
        run: ./scripts/ensure-history.sh

      - name: Check out previous Pages site
        id: previous
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: pages-live
          path: previous-pages

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev

      # Dependency sources only; Publish compiles the same crate the gates did.
      - name: Cache the Cargo dependency sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deps-publish-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-deps-publish-${{ runner.os }}-

      # Either upstream job may have failed, been skipped, or never uploaded
      # anything. A missing download is a fact this run publishes, never a
      # reason to stop publishing.
      - name: Download the native result
        id: native
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: native-result
          path: ${{ runner.temp }}/native

      - name: Download the web result
        id: web
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: web-result
          path: ${{ runner.temp }}/web

      - name: Build and assemble current status
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
          NATIVE_DOWNLOAD: ${{ steps.native.outcome }}
          WEB_DOWNLOAD: ${{ steps.web.outcome }}
          PREVIOUS_CHECKOUT: ${{ steps.previous.outcome }}
        run: |
          set -euo pipefail

          pages_root="$RUNNER_TEMP/pages"
          current="$pages_root/current"
          output="$pages_root/output"
          mkdir -p "$pages_root"

          native_args=()
          if [[ "$NATIVE_DOWNLOAD" == "success" ]]; then
            native_args=(--native "$RUNNER_TEMP/native")
          fi
          web_args=()
          if [[ "$WEB_DOWNLOAD" == "success" ]]; then
            web_args=(--web "$RUNNER_TEMP/web")
          fi
          previous_args=()
          if [[ "$PREVIOUS_CHECKOUT" == "success" ]]; then
            previous_args=(--previous "$GITHUB_WORKSPACE/previous-pages")
          fi

          # One repository-owned command decides everything this run
          # publishes: the merged gate matrix, the commit timeline, the
          # inherited screenshot history, whether the verified evidence really
          # projects, and whether a complete playable package was earned.
          project_inputs() {
            cargo run --quiet --bin sitegen -- inputs \
              --repository "$GITHUB_WORKSPACE" \
              --source-commit "$GITHUB_SHA" \
              --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --native-outcome "$VERIFY_RESULT" \
              --web-outcome "$WEB_RESULT" \
              "${native_args[@]}" \
              "${@}" \
              "${previous_args[@]}" \
              --output "$pages_root"
          }

          project_inputs "${web_args[@]}"

          # The two evidence sets project together or not at all, so a browser
          # summary this generator cannot read would take the whole native
          # render evidence down with it and publish a page with no frames on
          # it. When the native job declared evidence and nothing projected,
          # the browser summary is withdrawn from a private copy of the web
          # artifact and the native evidence is projected on its own. The
          # packaged game is untouched by that copy, so a green playable build
          # is still promoted from it.
          declared_native=0
          if [[ -f "$RUNNER_TEMP/native/result.json" ]] \
            && jq -e '.evidence != null' "$RUNNER_TEMP/native/result.json" >/dev/null; then
            declared_native=1
          fi
          if (( declared_native == 1 )) && (( ${#web_args[@]} > 0 )) \
            && ! jq -e '.verification != null' "$pages_root/inputs.json" >/dev/null; then
            echo "retrying the projection without this run's browser evidence" >&2
            retry_web="$RUNNER_TEMP/web-without-browser"
            rm -rf "$retry_web"
            cp -R "$RUNNER_TEMP/web" "$retry_web"
            rm -f "$retry_web/browser/browser-gate.json"
            project_inputs --web "$retry_web"
            # The retry is not a silent one: the refused browser evidence is
            # published as its own failed row, so the site says the frames it
            # shows came from the native run alone.
            jq '.gates += [{"name":"Published browser evidence","status":"failed","passed":0,"failed":1,"duration_ms":0,"artifact_url":null}]' \
              "$pages_root/workflow.json" >"$pages_root/workflow.retry.json"
            mv "$pages_root/workflow.retry.json" "$pages_root/workflow.json"
          fi

          cargo run --quiet --bin sitegen -- build \
            --inputs "$pages_root/inputs.json" \
            --output "$current"

          cargo run --quiet --bin sitegen -- assemble \
            "${previous_args[@]}" \
            --current "$current" \
            --result "$pages_root/workflow.json" \
            --output "$output"

          touch "$output/.nojekyll"
          cp .github/pages-live-README.md "$output/README.md"

      # The generated branch carries the packaged game, and that package is a
      # ~34 MB WebAssembly module. Republishing an identical tree would send
      # the whole thing again and leave another unreferenced root commit behind
      # on every run. Git names a tree by its content, so an unchanged
      # publication is recognised exactly and skipped: the deployment below
      # still runs, so a run that changes nothing still publishes its status.
      - name: Push generated Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_CHECKOUT: ${{ steps.previous.outcome }}
        run: |
          set -euo pipefail

          pages_root="$RUNNER_TEMP/pages"
          output="$pages_root/output"
          git_dir="$pages_root/publish.git"
          git init --bare "$git_dir"
          git --git-dir="$git_dir" symbolic-ref HEAD refs/heads/pages-live
          git --git-dir="$git_dir" --work-tree="$output" config user.name github-actions[bot]
          git --git-dir="$git_dir" --work-tree="$output" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git --git-dir="$git_dir" --work-tree="$output" add -A

          if [[ "$PREVIOUS_CHECKOUT" == "success" ]]; then
            published="$(git -C "$GITHUB_WORKSPACE/previous-pages" rev-parse 'HEAD^{tree}')"
            staged="$(git --git-dir="$git_dir" --work-tree="$output" write-tree)"
            if [[ "$staged" == "$published" ]]; then
              echo "pages-live already carries tree $staged; nothing to push"
              exit 0
            fi
          fi

          git --git-dir="$git_dir" --work-tree="$output" commit \
            -m "docs: publish status for ${GITHUB_SHA}"
          git --git-dir="$git_dir" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git --git-dir="$git_dir" push --force origin pages-live

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages/output

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
