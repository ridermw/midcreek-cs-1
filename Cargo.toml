[package]
name = "midcreek-cs-1"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "midcreek-cs-1"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui", "png", "serialize"] }
gltf = { version = "=1.4.1", features = ["KHR_materials_unlit"] }
gltf-json = { version = "=1.4.1", features = ["KHR_materials_unlit"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pulldown-cmark = "=0.13.4"
rand = "=0.10.2"
rand_chacha = "=0.10.0"
ron = "=0.12.2"
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["web", "webgl2"] }
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["Document", "Element", "HtmlElement", "Window"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

[profile.dev]
debug = 0

[profile.test]
debug = 0
