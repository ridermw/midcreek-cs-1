[package]
name = "midcreek-cs-1"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "midcreek-cs-1"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui", "png", "serialize"] }
gltf = "=1.4.1"
gltf-json = "=1.4.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rand = "=0.10.2"
rand_chacha = "=0.10.0"
ron = "=0.12.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0
